<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveautés de Nova</title>
<!-- Page des nouveautés, ouverte par le numéro de version des cartes « Réglages de Nova » (_widgets/version.phtml).
     Elle affiche CHANGELOG.md (seule source à tenir à jour) ; markdown réduit : titres, listes, gras, paragraphes. -->
<style>
@font-face { font-family: 'Atkinson Hyperlegible Next'; font-weight: 400 700; font-display: swap;
  src: url(polices/atkinson-hyperlegible-next-latin.woff2) format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible Next'; font-weight: 400 700; font-display: swap;
  src: url(polices/atkinson-hyperlegible-next-latin-ext.woff2) format('woff2'); unicode-range: U+0100-024F, U+2020, U+20AC; }
:root { --accent: #7A3B69; --texte: #1f1d23; --texte-2: #5b5662; --fond: #f6f5f8; --carte: #fff; --filet: #e4e1e8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 1rem/1.55 'Atkinson Hyperlegible Next', system-ui, sans-serif; }
header { background: var(--accent); color: #fff; padding: 1rem 16px; }
header h1 { margin: 0 auto; max-width: 46rem; font-size: 1.35rem; }
main { max-width: 46rem; margin: 0 auto; padding: 1rem 16px 3rem; }
main > p { color: var(--texte-2); }
section { background: var(--carte); border: 1px solid var(--filet); border-radius: 12px; padding: .25rem 1.25rem 1rem; margin: 1.25rem 0; }
h2 { color: var(--accent); font-size: 1.25rem; margin: 1rem 0 .25rem; }
h3 { font-size: 1rem; margin: 1rem 0 .25rem; color: var(--texte); }
ul { margin: .25rem 0; padding-left: 1.25rem; }
li { margin: .2rem 0; }
li::marker { color: var(--accent); }
a { color: var(--accent); }
</style>
</head>
<body>
<header><h1>Nouveautés de Nova</h1></header>
<main id="contenu"><p>Chargement… Sinon : <a href="CHANGELOG.md">CHANGELOG.md</a>.</p></main>
<script>
(function () {
  var main = document.getElementById('contenu');
  function echap(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function enLigne(t) { return echap(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  fetch('CHANGELOG.md', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function (md) {
    var html = '', liste = false, section = false, para = [];
    function finPara() { if (para.length) { html += '<p>' + enLigne(para.join(' ')) + '</p>'; para = []; } }
    function finListe() { if (liste) { html += '</ul>'; liste = false; } }
    md.split(/\r?\n/).forEach(function (l) {
      var m;
      if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) {
        finPara(); finListe();
        var n = m[1].length;
        if (n === 1) { document.title = m[2]; document.querySelector('header h1').textContent = m[2]; return; }
        if (n === 2) { if (section) html += '</section>'; html += '<section>'; section = true; }
        html += '<h' + n + '>' + enLigne(m[2]) + '</h' + n + '>';
      } else if ((m = /^\s*[-*]\s+(.*)$/.exec(l))) {
        finPara();
        if (!liste) { html += '<ul>'; liste = true; }
        html += '<li>' + enLigne(m[1]) + '</li>';
      } else if (!l.trim()) {
        finPara(); finListe();
      } else {
        finListe(); para.push(l.trim());
      }
    });
    finPara(); finListe();
    if (section) html += '</section>';
    main.innerHTML = html;
  }).catch(function () {});
})();
</script>
</body>
</html>
